<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Order summary card</title>
</head>

<body>
   <picture class="picture">
      <source media="(min-width:376px)"
      srcset="./images/pattern-background-desktop.svg" class="desktop-background">
    <img class="mobile-background" src="./images/pattern-background-mobile.svg" alt="">
    </picture>
  <main>
    <div class="wrapper">
      <img class="hero-image" src="./images/illustration-hero.svg" alt="">
      <div class="info">
        <h1 class="heading">Order Summary</h1>
        <p class="paragraph">You can now listen to millions of songs, audiobooks, and podcasts on any
          device anywhere you like!</p>
        <div class="action">
          <div class="text">
            <div class="music-section">
            <img class="music-icon" src="./images/icon-music.svg" alt="">
            <div class="sub-text">
              <p class="annual">Annual Plan</p>
              <p class="money">$59.99/year</p>
            </div>
            </div>
            <a href="#">Change</a>
          </div>
          <a href="#" class="cta-btn">Proceed to Payment</a>
          <a href="#" class="cancel-btn">Cancel Order</a>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
